# The plugin runs on the Kotlin standard library that Rider bundles, so none is packaged with it.
kotlin.stdlib.default.dependency=false
kotlin.code.style=official

org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.configuration-cache=true

pluginGroup=com.soxtoby.dresssharp
pluginVersion=0.1.0
# The Rider release the plugin is built against when riderPath is not set.
platformVersion=2026.2.3.1
# Build against an installed Rider instead of downloading one: ./gradlew buildPlugin -PriderPath="C:/Users/me/AppData/Local/Programs/Rider"
# riderPath=

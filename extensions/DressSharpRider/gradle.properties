# The plugin runs on the Kotlin standard library that Rider bundles, so none is packaged with it.
kotlin.stdlib.default.dependency=false
kotlin.code.style=official

org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.configuration-cache=true

pluginGroup=com.soxtoby.dresssharp
# Compile against the oldest supported Rider so newer APIs cannot silently raise the minimum version.
platformVersion=2025.2
# Build against an installed Rider instead of downloading one: ./gradlew buildPlugin -PriderPath="C:/Users/me/AppData/Local/Programs/Rider"
# riderPath=

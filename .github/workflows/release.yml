name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: ./do pack
      - name: NuGet login
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish release
        run: ./do release
        env:
          DOTNETDO_NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
          GH_TOKEN: ${{ github.token }}

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  rider:
    uses: ./.github/workflows/rider.yml

  release:
    needs: rider
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: ./do test
      - run: ./do pack
      - name: Download Rider plugin
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.rider.outputs.artifact-id }}
          path: extensions/DressSharpRider/build/distributions
          skip-decompress: true
      - name: NuGet login
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish release
        run: ./do release
        env:
          DOTNETDO_NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
          GH_TOKEN: ${{ github.token }}

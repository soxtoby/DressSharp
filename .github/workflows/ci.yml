name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - windows-2025
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Restore
        run: dotnet restore DressSharp.slnx
      - name: Restore tools
        run: dotnet tool restore
      - name: Build
        run: dotnet build DressSharp.slnx -c Release --no-restore
      - name: Test
        run: dotnet test DressSharp.slnx -c Release --no-build --no-restore
      - name: Pack
        run: dotnet pack src/DressSharp/DressSharp.csproj -c Release --no-build --no-restore
